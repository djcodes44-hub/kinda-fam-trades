<style>
/* ==========================================================================
   LAYOUT CONCEPT: a scoreboard-style league board on deep navy.
   Cyan is reserved for strength. Coral and orange mark holes.
   Dark mode only, by design.
   ========================================================================== */
:root {
  /* Color tokens */
  --bg: #121c42;
  --surface: #1a2757;
  --surface-2: #222f69;
  --line: #2f3f86;
  --text: #eaf1ff;
  --dim: #9fb1dd;
  --primary: #65cee0;
  --ink: #0d1533;
  --hole: #e5586f;
  --warn: #f29b6c;
  --amber: #f5c451;
  --violet: #8f9aea;

  /* Heat scale (diverging: coral > orange > slate > teal > cyan) */
  --h-2: #e5586f;
  --h-1: #f29b6c;
  --h-0: #3a4a8c;
  --h-p1: #1f6f94;
  --h-p2: #65cee0;

  /* Type tokens */
  --f-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;

  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 15px/1.45 var(--f-body);
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 1040px; margin: 0 auto; }
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ---------- Header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
.eyebrow { margin: 0; font: 600 12px var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--primary); }
h1 { margin: 4px 0 0; font: 700 clamp(38px, 8vw, 60px)/.95 var(--f-display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.srcbox { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.src { display: inline-flex; align-items: center; gap: 8px; font: 500 13px var(--f-body); color: var(--dim); }
.src::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.src.live { color: var(--text); }
.src.live::before { background: var(--primary); box-shadow: 0 0 0 3px rgba(101,206,224,.25); }
.btn {
  appearance: none; cursor: pointer; background: transparent; color: var(--primary);
  border: 1px solid var(--primary); border-radius: 8px; padding: 6px 12px;
  font: 600 13px var(--f-body); letter-spacing: .03em;
}
.btn:hover { background: rgba(101,206,224,.12); }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 24px 0 18px; overflow-x: auto; }
.tab {
  appearance: none; background: none; border: 0; cursor: pointer; white-space: nowrap;
  color: var(--dim); font: 600 18px var(--f-display); letter-spacing: .07em; text-transform: uppercase;
  padding: 10px 14px; border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--primary); }
.tab .next { margin-left: 8px; font: 600 10px var(--f-body); letter-spacing: .1em; color: var(--violet); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; vertical-align: 3px; }

/* ---------- Controls ---------- */
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin-bottom: 14px; }
.ctl-label { font: 600 11px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-right: 8px; }
.weeks { display: flex; align-items: center; gap: 6px; max-width: 100%; overflow-x: auto; padding-bottom: 2px; }
.wk, .fchip {
  appearance: none; cursor: pointer; white-space: nowrap; min-width: 44px;
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; padding: 6px 10px; font: 600 14px var(--f-display); letter-spacing: .04em;
}
.wk[aria-pressed="true"], .fchip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--ink); }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.toggle input { accent-color: var(--primary); width: 17px; height: 17px; margin: 0; }
select {
  background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 28px 6px 10px; font: 500 14px var(--f-body);
}
.status { min-height: 20px; margin: 0 0 8px; font-size: 13px; color: var(--dim); }

/* ---------- Legend and takeaway ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 4px 0 6px; font-size: 12.5px; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.take { margin: 10px 0 14px; font-size: 15px; max-width: 70ch; }
.take b { color: var(--primary); font-weight: 600; }

/* ---------- Heatmap table ---------- */
.tablewrap { overflow-x: auto; padding-bottom: 6px; }
table.heat { border-collapse: separate; border-spacing: 6px; width: 100%; min-width: 700px; }
.heat thead th {
  font: 600 12px var(--f-body); letter-spacing: .1em; text-transform: uppercase;
  color: var(--dim); text-align: center; vertical-align: bottom; padding: 0 0 2px;
}
.heat thead th small { display: block; font-weight: 500; letter-spacing: .03em; text-transform: none; font-size: 11px; }
.heat thead th.team, .heat thead th.readh { text-align: left; }
.heat th.team {
  position: sticky; left: 0; z-index: 2; background: var(--bg);
  text-align: left; min-width: 160px; max-width: 190px; padding-right: 8px; font-weight: 400;
}
.teambtn {
  appearance: none; background: none; border: 0; padding: 4px 0; cursor: pointer; text-align: left; width: 100%;
  display: flex; flex-direction: column; gap: 1px;
}
.tname { font: 600 16px/1.15 var(--f-body); }
.tmeta { font: 400 12.5px var(--f-body); color: var(--dim); font-variant-numeric: tabular-nums; }
.teambtn:hover .tname { color: var(--primary); }
tr.row.open .tname { color: var(--primary); }

.cell {
  appearance: none; border: 0; cursor: pointer; width: 100%; min-width: 56px; height: 56px; border-radius: 9px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  font-variant-numeric: tabular-nums;
}
.cell b { font: 700 26px/1 var(--f-display); }
.cell i { font: 600 11px/1.1 var(--f-body); font-style: normal; letter-spacing: .02em; margin-top: 2px; }
.cell:hover { filter: brightness(1.1); }
.cell.sel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--primary); }
.hm2 { background: var(--h-2); color: var(--ink); }
.hm1 { background: var(--h-1); color: var(--ink); }
.h0  { background: var(--h-0); color: var(--text); }
.hp1 { background: var(--h-p1); color: #fff; }
.hp2 { background: var(--h-p2); color: var(--ink); }
div.cell { cursor: default; }
div.cell:hover { filter: none; }
.heat tfoot th { font: 600 12px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); text-align: left; position: sticky; left: 0; background: var(--bg); z-index: 2; }
.heat tfoot .cell { height: 46px; }
.heat tfoot .cell b { font-size: 21px; }

.read { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; border: 1px solid;
  font: 600 11px var(--f-body); letter-spacing: .04em; white-space: nowrap;
}
.chip.hole { color: #ffb48f; border-color: rgba(242,155,108,.6); }
.chip.stack { color: var(--primary); border-color: rgba(101,206,224,.55); }
.chip.warn { color: var(--amber); border-color: rgba(245,196,81,.55); }

/* ---------- Team detail ---------- */
tr.detail td { padding: 0; }
.detailbox {
  position: sticky; left: 0; width: calc(100vw - 32px); max-width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 8px;
}
.dhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; margin-bottom: 10px; }
.dhead h3 { margin: 0; font: 700 24px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; }
.dhead p { margin: 0; color: var(--dim); font-size: 13px; }
.dgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px 18px; }
.dcol { min-width: 0; margin-bottom: 8px; }
.dcol h4 { margin: 0 0 4px; font: 600 12px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.dcol.focus h4 { color: var(--primary); }
.dcol ul { list-style: none; margin: 0; padding: 0; }
.pl { padding: 7px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; }
.pl .pn { font-weight: 500; overflow-wrap: anywhere; }
.pl .pn em { font-style: normal; color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 5px; }
.pl .ps { font: 600 10px var(--f-body); letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }
.pl.dead .pn { color: var(--dim); text-decoration: line-through; text-decoration-color: rgba(159,177,221,.5); }
.pl .bd { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; }
.pl .bd:empty { display: none; }
.badge { font: 700 10px var(--f-body); letter-spacing: .08em; padding: 1px 6px; border-radius: 4px; }
.badge.q { background: var(--amber); color: var(--ink); }
.badge.out { background: var(--hole); color: var(--ink); }
.badge.bye { background: var(--violet); color: var(--ink); }

/* ---------- Injury Board ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.icard { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 10px; }
.ihead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 10px; margin-bottom: 8px; }
.ihead h3 { margin: 0; font: 700 22px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.ihead p { margin: 3px 0 0; color: var(--dim); font-size: 12.5px; }
.isec { margin-bottom: 8px; }
.isec h4 { margin: 0 0 2px; font: 600 11px var(--f-body); letter-spacing: .12em; text-transform: uppercase; }
.isec h4.sv-IR, .isec h4.sv-OUT { color: #ff8da0; }
.isec h4.sv-DOUBT { color: var(--warn); }
.isec h4.sv-Q { color: var(--amber); }
.isec h4.sv-BYE { color: var(--violet); }
.isec ul { list-style: none; margin: 0; padding: 0; }
.ip { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
.ip .pn { font-weight: 500; overflow-wrap: anywhere; }
.ip .pn em { font-style: normal; color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 6px; }
.ip .ps { font: 600 10px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.ip .ps.start { color: var(--primary); }
.clean { margin: 6px 0 4px; color: var(--dim); font-size: 13.5px; }

/* ---------- Trade Matcher ---------- */
.pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.pair { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 12px; }
.pair.one { border-style: dashed; }
.pair h3 { margin: 0 0 10px; font: 700 21px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.pair h3 span { color: var(--primary); margin: 0 6px; }
.leg { padding: 8px 0; border-top: 1px solid var(--line); }
.leg h4 { margin: 0 0 2px; font: 600 11px var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--primary); }
.leg p { margin: 0 0 2px; font-size: 13.5px; color: var(--dim); }
.leg p b { color: var(--text); font-weight: 600; }
.leg .none { color: var(--dim); font-style: italic; }

/* ---------- Notes and stub panels ---------- */
.notes { margin: 18px 0 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 13.5px; color: var(--dim); }
.notes p { margin: 0 0 6px; max-width: 78ch; }
.notes p:last-child { margin: 0; }
.notes b { color: var(--text); font-weight: 600; }
.stub { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px 22px; max-width: 640px; }
.stub h2 { margin: 0 0 8px; font: 700 28px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.stub p { margin: 0 0 10px; max-width: 60ch; }
.stub p:last-child { margin: 0; color: var(--dim); }
.foot { margin-top: 26px; font-size: 12.5px; color: var(--dim); max-width: 78ch; }

@media (max-width: 760px) {
  .dgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>

      { id: 2, team: 'Team Nantor', mgr: 'Noah', w: 2, l: 3, pf: 564.99, empty: 0, p: [

        'C.J. Stroud|QB|HOU|B|', 'Samaje Perine|RB|CIN|B|', 'Chase Brown|RB|CIN|B|',
        'Rome Odunze|WR|CHI|B|', 'Deebo Samuel|WR|SF|B|O', 'Jake Ferguson|TE|DAL|B|', 'Chase McLaughlin|K|TB|B|'
      ] },
      { id: 6, team: 'ReadySetDykes', mgr: 'Neah & Kaylee', w: 1, l: 4, pf: 671.80, empty: 1, p: [
        'Kirk Cousins|QB|LV|S|', 'Derrick Henry|RB|BAL|S|', 'Bhayshul Tuten|RB|JAX|S|',
        'Amon-Ra St. Brown|WR|DET|S|', 'Harold Fannin|TE|CLE|S|', 'Michael Wilson|WR|ARI|S|',
        'Ladd McConkey|WR|LAC|S|Q', "Ka'imi Fairbairn|K|HOU|S|",
        'Lamar Jackson|QB|BAL|B|Q', 'Mike Washington|RB|LV|B|', 'Tony Pollard|RB|TEN|B|',
        'Rachaad White|RB|WAS|B|', 'Malik Washington|WR|MIA|B|', 'Darius Cooper|WR|PHI|B|',
        'Stefon Diggs|WR|WAS|B|Q', 'Brenton Strange|TE|JAX|B|'

        'Quinshon Judkins|RB|CLE|S|Q', 'KC Concepcion|WR|CLE|S|Q', 'Brandon Aubrey|K|DAL|S|',
        'Patrick Mahomes|QB|KC|B|', 'Tyrone Tracy|RB|NYG|B|', 'Omarion Hampton|RB|LAC|B|',
        'Kyle Monangai|RB|CHI|B|Q', 'Rashid Shaheed|WR|SEA|B|', 'Colston Loveland|TE|CHI|B|',
        'Cameron Dicker|K|LAC|B|', 'D. Stribling|WR|SF|IR|IR'
      ] }
    ]
  };

  function parseSnapshot(raw) {
    return {
      asOf: raw.asOf,
      week: raw.week,
      source: 'snapshot',
      teams: raw.teams.map(function (t, i) {
        return {
          id: t.id, team: t.team, mgr: t.mgr, w: t.w, l: t.l, pf: t.pf, rank: i + 1, empty: t.empty || 0,
          players: t.p.map(function (line) {
            var f = line.split('|');
            return { name: f[0], pos: f[1], nfl: f[2], slot: f[3], status: f[4] || '' };
          })
        };
      })
    };
  }

  function mapStatus(s) {
    if (!s) return '';
    if (s === 'Questionable') return 'Q';
    if (s === 'Doubtful') return 'D';
    if (s === 'Out') return 'O';
    if (s === 'IR') return 'IR';
    if (s === 'NA') return 'NA';
    return 'O'; // PUP, Sus, DNR, COV and anything else is treated as unavailable
  }

  // Build the same shape as the snapshot from Sleeper API responses.
  function fromSleeper(users, rosters, pmap, nflState) {
    var uById = {};
    users.forEach(function (u) { uById[u.user_id] = u; });
    var teams = rosters.map(function (r) {
      var u = uById[r.owner_id] || {};
      var meta = u.metadata || {};
      var name = (meta.team_name && String(meta.team_name).trim()) || ('Team ' + (u.display_name || r.roster_id));
      var reserve = r.reserve || [];
      var starters = r.starters || [];
      var players = [];
      (r.players || []).forEach(function (id) {
        var info = pmap[id];
        if (!info || POS.indexOf(info.p) < 0) return;
        var slot = reserve.indexOf(id) >= 0 ? 'IR' : (starters.indexOf(id) >= 0 ? 'S' : 'B');
        players.push({ name: info.n, pos: info.p, nfl: info.t, slot: slot, status: slot === 'IR' ? 'IR' : mapStatus(info.i) });
      });
      var s = r.settings || {};
      return {
        id: r.roster_id, team: name, mgr: OWNER_FIRST[r.owner_id] || u.display_name || '',
        w: s.wins || 0, l: s.losses || 0, pf: (s.fpts || 0) + (s.fpts_decimal || 0) / 100,
        empty: starters.filter(function (x) { return x === '0' || x === 0; }).length,
        players: players
      };
    });
    teams.sort(function (a, b) { return (b.w - a.w) || (b.pf - a.pf); });
    teams.forEach(function (t, i) { t.rank = i + 1; });
    var wk = nflState && nflState.season_type === 'regular' && nflState.week ? nflState.week : null;
    return { asOf: new Date().toISOString(), week: wk, source: 'live', teams: teams };
  }

  // Depth math for one team.
  // A player is usable if he is not on IR, not Out/Doubtful/NA, and not on bye in the chosen week.
  // Questionable players count as usable only when countQ is true.
  function compute(team, week, countQ) {
    var cells = {};
    POS.forEach(function (p) { cells[p] = { usable: 0, sur: 0 }; });
    var players = team.players.map(function (p) {
      var st = 'ok';
      if (p.slot === 'IR' || ['IR', 'O', 'D', 'NA'].indexOf(p.status) >= 0) st = 'out';
      else if (week && BYE[p.nfl] === week) st = 'bye';
      else if (p.status === 'Q') st = 'q';
      var usable = st === 'ok' || (st === 'q' && countQ);
      return { name: p.name, pos: p.pos, nfl: p.nfl, slot: p.slot, status: p.status, st: st, usable: usable };
    });
    players.forEach(function (p) { if (p.usable && cells[p.pos]) cells[p.pos].usable++; });
    POS.forEach(function (p) { cells[p].sur = cells[p].usable - NEED[p]; });
    // FLEX pool: RB, WR and TE left over after every base starter is covered
    var left = Math.max(0, cells.RB.usable - NEED.RB) + Math.max(0, cells.WR.usable - NEED.WR) + Math.max(0, cells.TE.usable - NEED.TE);
    var flex = { usable: left, sur: left - FLEX_NEED };
    var holes = [], stacks = [], short = 0;
    POS.forEach(function (p) {
      if (cells[p].sur < 0) { holes.push(p); short += cells[p].sur; }
    });
    if (flex.sur < 0) { holes.push('FLEX'); short += flex.sur; }
    // "Deep" = 3+ spare at RB or WR, 2+ spare at TE or QB
    ['RB', 'WR', 'TE', 'QB'].forEach(function (p) {
      var bar = (p === 'RB' || p === 'WR') ? 3 : 2;
      if (cells[p].sur >= bar) stacks.push(p);
    });
    return { cells: cells, flex: flex, players: players, holes: holes, stacks: stacks, short: short };
  }

  return {
    LEAGUE_ID: LEAGUE_ID, POS: POS, NEED: NEED, FLEX_NEED: FLEX_NEED, BYE: BYE,
    snapshot: parseSnapshot(RAW), parseSnapshot: parseSnapshot, fromSleeper: fromSleeper,
    mapStatus: mapStatus, compute: compute
  };
})();
</script>

<!-- ==================== SCRIPT 2: interface ==================== -->
<script>
(function () {
  'use strict';
  var KF = window.KF;
  var BASE = 'https://api.sleeper.app/v1';
  var COLS = ['QB', 'RB', 'WR', 'TE', 'FLEX', 'K'];
  var MINUS = '−';

  var state = {
    tab: 'depth', data: KF.snapshot, source: 'snapshot', baseWeek: KF.snapshot.week,
    week: KF.snapshot.week, weekTouched: false, countQ: true, sort: 'standings',
    openTeam: null, openPos: null, liveAt: null, fPos: 'ALL', fSev: 'ALL', tmThin: true, tmOne: false
  };

  function $(s) { return document.querySelector(s); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function sgn(n) { return n > 0 ? '+' + n : (n < 0 ? MINUS + Math.abs(n) : '0'); }
  function heat(n) {
    var r = Math.round(n);
    if (r <= -2) return 'hm2';
    if (r === -1) return 'hm1';
    if (r === 0) return 'h0';
    if (r === 1) return 'hp1';
    return 'hp2';
  }
  function fmtDate(iso) {
    try {
      return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/Detroit' });
    } catch (e) { return ''; }
  }

  function weekChipsHTML(w) {
    var out = '';
    for (var k = state.baseWeek; k <= 14; k++) {
      out += '<button type="button" class="wk" data-act="week" data-week="' + k + '" aria-pressed="' + (w === k) + '">' +
        (k === state.baseWeek ? 'Wk ' + k + ' now' : 'Wk ' + k) + '</button>';
    }
    out += '<button type="button" class="wk" data-act="week" data-week="0" aria-pressed="' + (!w) + '">No byes</button>';
    return out;
  }

  /* ---------- Depth Map ---------- */
  function depthHTML() {
    var d = state.data, w = state.week;
    var comp = d.teams.map(function (t) { return { t: t, c: KF.compute(t, w, state.countQ) }; });
    var rows = comp.slice();
    if (state.sort === 'holes') rows.sort(function (a, b) { return (a.c.short - b.c.short) || (a.t.rank - b.t.rank); });

    // league averages by column
    var avg = {};
    COLS.forEach(function (col) {
      var sum = 0;
      comp.forEach(function (x) { sum += col === 'FLEX' ? x.c.flex.sur : x.c.cells[col].sur; });
      avg[col] = sum / comp.length;
    });
    var skill = ['RB', 'WR', 'TE'].slice().sort(function (a, b) { return avg[a] - avg[b]; });
    var fmtAvg = function (v) { var r = Math.round(v * 10) / 10; return (r > 0 ? '+' : (r < 0 ? MINUS : '')) + Math.abs(r).toFixed(1); };
    var take = '<p class="take">Tightest skill position ' + (w ? 'in Week ' + w : 'across the season') + ': <b>' + skill[0] +
      '</b> (' + fmtAvg(avg[skill[0]]) + ' spare per team on average). Deepest: <b>' + skill[2] + '</b> (' + fmtAvg(avg[skill[2]]) + ').</p>';

    var weekChips = weekChipsHTML(w);

    var head = '<tr><th class="team" scope="col">Team</th>';
    COLS.forEach(function (col) {
      var need = col === 'FLEX' ? KF.FLEX_NEED : KF.NEED[col];
      head += '<th scope="col">' + col + '<small>need ' + need + '</small></th>';
    });
    head += '<th scope="col" class="readh">Read</th></tr>';

    var body = '';
    rows.forEach(function (x) {
      var t = x.t, c = x.c, open = state.openTeam === t.id;
      body += '<tr class="row' + (open ? ' open' : '') + '"><th scope="row" class="team">' +
        '<button type="button" class="teambtn" data-act="team" data-team="' + t.id + '" aria-expanded="' + open + '">' +
        '<span class="tname">' + esc(t.team) + '</span>' +
        '<span class="tmeta">' + esc(t.mgr) + ' · ' + t.w + '-' + t.l + ' · ' + t.pf.toFixed(1) + ' PF</span></button></th>';
      COLS.forEach(function (col) {
        var cell = col === 'FLEX' ? c.flex : c.cells[col];
        var need = col === 'FLEX' ? KF.FLEX_NEED : KF.NEED[col];
        var sel = open && state.openPos === col ? ' sel' : '';
        body += '<td><button type="button" class="cell ' + heat(cell.sur) + sel + '" data-act="cell" data-team="' + t.id + '" data-pos="' + col + '"' +
          ' aria-label="' + esc(t.team) + ' ' + col + ': ' + cell.usable + ' usable, need ' + need + '"><b>' + cell.usable + '</b><i>' + sgn(cell.sur) + '</i></button></td>';
      });
      var chips = '';
      c.holes.forEach(function (h) { chips += '<span class="chip hole">' + (h === 'FLEX' ? 'Thin FLEX' : 'Short ' + h) + '</span>'; });
      c.stacks.forEach(function (s) { chips += '<span class="chip stack">Deep ' + s + '</span>'; });
      if (t.empty) chips += '<span class="chip warn">Empty starter slot</span>';
      if (!chips) chips = '<span class="tmeta">Balanced</span>';
      body += '<td><div class="read">' + chips + '</div></td></tr>';
      if (open) body += '<tr class="detail"><td colspan="8">' + detailHTML(t, c) + '</td></tr>';
    });

    var foot = '<tr><th scope="row">League avg</th>';
    COLS.forEach(function (col) {
      foot += '<td><div class="cell ' + heat(avg[col]) + '"><b>' + fmtAvg(avg[col]) + '</b><i>spare</i></div></td>';
    });
    foot += '<td></td></tr>';

    return '' +
      '<div class="controls">' +
        '<div class="weeks" role="group" aria-label="Week"><span class="ctl-label">Byes for</span>' + weekChips + '</div>' +
      '</div>' +
      '<div class="controls">' +
        '<label class="toggle"><input type="checkbox" id="countQ"' + (state.countQ ? ' checked' : '') + '> Count questionable players as available</label>' +
        '<label class="toggle"><span class="ctl-label" style="margin:0">Sort</span>' +
          '<select id="sort"><option value="standings"' + (state.sort === 'standings' ? ' selected' : '') + '>League standings</option>' +
          '<option value="holes"' + (state.sort === 'holes' ? ' selected' : '') + '>Biggest holes first</option></select></label>' +
      '</div>' +
      '<p class="status" id="status" role="status" aria-live="polite"></p>' +
      take +
      '<div class="legend" aria-label="Color key">' +
        '<span><i style="background:var(--h-2)"></i>2+ short</span><span><i style="background:var(--h-1)"></i>1 short</span>' +
        '<span><i style="background:var(--h-0)"></i>No spare</span><span><i style="background:var(--h-p1)"></i>1 spare</span>' +
        '<span><i style="background:var(--h-p2)"></i>2+ spare</span></div>' +
      '<div class="tablewrap"><table class="heat"><thead>' + head + '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>' +
      '<div class="notes">' +
        '<p><b>How to read it.</b> The big number is how many usable players a team has at that spot. The small number is how many more (or fewer) than the starting lineup needs.</p>' +
        '<p><b>Usable</b> means not on IR, not Out, Doubtful or NA, and not on bye in the week you pick. Questionable players count unless you switch that off. FLEX counts the RBs, WRs and TEs left over after every other starter spot is filled.</p>' +
        '<p>In the Read column, <b>Short</b> means a spot has fewer usable players than it needs. <b>Deep</b> means 3 or more spare at RB or WR, or 2 or more spare at TE or QB.</p>' +
        '<p>Injury statuses come from Sleeper, so picking a later week only changes byes. Tap a team or a cell to see the players behind it.</p>' +
      '</div>';
  }

  function detailHTML(t, c) {
    var order = { S: 0, B: 1, IR: 2 };
    var slotName = { S: 'Start', B: 'Bench', IR: 'IR' };
    var cols = '';
    KF.POS.forEach(function (pos) {
      var list = c.players.filter(function (p) { return p.pos === pos; });
      list.sort(function (a, b) { return (order[a.slot] - order[b.slot]) || a.name.localeCompare(b.name); });
      var focus = state.openPos === pos || (state.openPos === 'FLEX' && (pos === 'RB' || pos === 'WR' || pos === 'TE'));
      var items = list.map(function (p) {
        var b = '';
        if (p.st === 'out') b = '<span class="badge out">' + (p.status === 'D' ? 'DOUBTFUL' : (p.status === 'O' ? 'OUT' : (p.status === 'NA' ? 'NA' : 'IR'))) + '</span>';
        else if (p.st === 'bye') b = '<span class="badge bye">BYE</span>';
        else if (p.st === 'q') b = '<span class="badge q">QUESTIONABLE</span>';
        return '<li class="pl' + (p.usable ? '' : ' dead') + '"><span class="pn">' + esc(p.name) + '<em>' + esc(p.nfl) + '</em></span>' +
          '<span class="ps">' + slotName[p.slot] + '</span><span class="bd">' + b + '</span></li>';
      }).join('');
      cols += '<div class="dcol' + (focus ? ' focus' : '') + '"><h4>' + pos + ' · ' + c.cells[pos].usable + ' usable</h4><ul>' + (items || '<li class="pl"><span class="pn" style="color:var(--dim)">None rostered</span></li>') + '</ul></div>';
    });
    return '<div class="detailbox"><div class="dhead"><h3>' + esc(t.team) + '</h3><p>' + esc(t.mgr) + ' · ' + t.w + '-' + t.l +
      (t.empty ? ' · ' + t.empty + ' empty starter slot' : '') + '</p></div><div class="dgrid">' + cols + '</div></div>';
  }

  /* ---------- Injury Board ---------- */
  var SEV = [
    { key: 'IR', label: 'On IR' },
    { key: 'OUT', label: 'Out or NA' },
    { key: 'DOUBT', label: 'Doubtful' },
    { key: 'Q', label: 'Questionable' }
  ];
  var SLOT_LABEL = { S: 'Starter', B: 'Bench', IR: 'IR spot' };
  var SLOT_ORDER = { S: 0, B: 1, IR: 2 };

  function sevOf(p) {
    if (p.slot === 'IR' || p.status === 'IR') return 'IR';
    if (p.status === 'O' || p.status === 'NA') return 'OUT';
    if (p.status === 'D') return 'DOUBT';
    if (p.status === 'Q') return 'Q';
    return '';
  }
  function fchips(items, cur, act) {
    return items.map(function (it) {
      return '<button type="button" class="fchip" data-act="' + act + '" data-v="' + it[0] + '" aria-pressed="' + (cur === it[0]) + '">' + it[1] + '</button>';
    }).join('');
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function playerRows(list) {
    list.sort(function (a, b) { return (SLOT_ORDER[a.slot] - SLOT_ORDER[b.slot]) || a.name.localeCompare(b.name); });
    return '<ul>' + list.map(function (p) {
      return '<li class="ip"><span class="pn">' + esc(p.name) + '<em>' + p.pos + ' · ' + esc(p.nfl) + '</em></span>' +
        '<span class="ps' + (p.slot === 'S' ? ' start' : '') + '">' + SLOT_LABEL[p.slot] + '</span></li>';
    }).join('') + '</ul>';
  }

  function injuriesHTML() {
    var w = state.week, d = state.data;
    var totals = { IR: 0, OUT: 0, DOUBT: 0, Q: 0 }, startersHurt = 0;
    var filtering = state.fPos !== 'ALL' || state.fSev !== 'ALL';
    var posOk = function (p) { return state.fPos === 'ALL' || p.pos === state.fPos; };

    var cards = d.teams.map(function (t) {
      var ps = t.players.map(function (p) {
        return { name: p.name, pos: p.pos, nfl: p.nfl, slot: p.slot, sev: sevOf(p), bye: !!(w && KF.BYE[p.nfl] === w) };
      });
      var sOut = 0, sQ = 0;
      ps.forEach(function (p) {
        if (p.sev) totals[p.sev]++;
        if (p.slot === 'S' && (p.sev === 'OUT' || p.sev === 'DOUBT')) { sOut++; startersHurt++; }
        if (p.slot === 'S' && p.sev === 'Q') sQ++;
      });
      var hurt = ps.filter(function (p) { return p.sev && posOk(p) && (state.fSev === 'ALL' || p.sev === state.fSev); });
      var byes = state.fSev === 'ALL' ? ps.filter(function (p) { return p.bye && posOk(p); }) : [];
      return { t: t, hurt: hurt, byes: byes, sOut: sOut, sQ: sQ };
    });
    cards.sort(function (a, b) {
      return (b.sOut - a.sOut) || (b.sQ - a.sQ) || (b.hurt.length - a.hurt.length) || (a.t.rank - b.t.rank);
    });
    var shown = cards.filter(function (c) { return !filtering || c.hurt.length || c.byes.length; });

    var cardsHTML = shown.map(function (c) {
      var t = c.t, body = '';
      SEV.forEach(function (s) {
        var list = c.hurt.filter(function (p) { return p.sev === s.key; });
        if (list.length) body += '<div class="isec"><h4 class="sv-' + s.key + '">' + s.label + '</h4>' + playerRows(list) + '</div>';
      });
      if (c.byes.length) body += '<div class="isec"><h4 class="sv-BYE">On bye in Week ' + w + '</h4>' + playerRows(c.byes) + '</div>';
      if (!body) body = '<p class="clean">No injuries on this roster.</p>';
      var chips = '';
      if (c.sOut) chips += '<span class="chip hole">' + plural(c.sOut, 'starter', 'starters') + ' hurt</span>';
      if (c.sQ) chips += '<span class="chip warn">' + plural(c.sQ, 'starter', 'starters') + ' questionable</span>';
      if (!chips) chips = '<span class="tmeta">No starters hurt</span>';
      return '<article class="icard"><div class="ihead"><div><h3>' + esc(t.team) + '</h3><p>' + esc(t.mgr) + ' · ' + t.w + '-' + t.l +
        '</p></div><div class="read">' + chips + '</div></div>' + body + '</article>';
    }).join('');

    var line = '<p class="take">Across the league: <b>' + totals.IR + '</b> on IR, <b>' + totals.OUT + '</b> out or NA, <b>' + totals.DOUBT +
      '</b> doubtful, <b>' + totals.Q + '</b> questionable. <b>' + startersHurt + '</b> ' + (startersHurt === 1 ? 'starter is' : 'starters are') + ' out or doubtful.</p>';

    return '' +
      '<div class="controls"><div class="weeks" role="group" aria-label="Week"><span class="ctl-label">Byes for</span>' + weekChipsHTML(w) + '</div></div>' +
      '<div class="controls"><div class="weeks" role="group" aria-label="Position"><span class="ctl-label">Position</span>' +
        fchips([['ALL', 'All'], ['QB', 'QB'], ['RB', 'RB'], ['WR', 'WR'], ['TE', 'TE'], ['K', 'K']], state.fPos, 'fpos') + '</div></div>' +
      '<div class="controls"><div class="weeks" role="group" aria-label="Status"><span class="ctl-label">Status</span>' +
        fchips([['ALL', 'All'], ['IR', 'IR'], ['OUT', 'Out / NA'], ['DOUBT', 'Doubtful'], ['Q', 'Questionable']], state.fSev, 'fsev') + '</div></div>' +
      line +
      (shown.length ? '<div class="cards">' + cardsHTML + '</div>' : '<p class="take">No players match those filters.</p>') +
      '<div class="notes"><p>Teams with the most starters hurt come first. Starters are listed before bench players. A player on bye shows in the bye list even when healthy, so a questionable player on bye appears in both places.</p>' +
      '<p>Statuses come from Sleeper. Pick a later week to see its byes, but the injury list does not change.</p></div>';
  }

  /* ---------- Trade Matcher ---------- */
  // Need: usable players below the lineup requirement (hole). Optional: exactly at the requirement (thin).
  // Spare: surplus of 2 or more at a position. Tradeable spares are healthy players, bench first.
  function tradeModel(w) {
    var infos = state.data.teams.map(function (t) {
      var c = KF.compute(t, w, state.countQ);
      var needs = {}, spares = {};
      ['QB', 'RB', 'WR', 'TE', 'K'].forEach(function (pos) {
        var sur = c.cells[pos].sur;
        if (sur < 0) needs[pos] = { kind: 'hole', sur: sur };
        else if (sur === 0 && state.tmThin) needs[pos] = { kind: 'thin', sur: 0 };
        if (sur >= 2) {
          var give = c.players.filter(function (p) { return p.pos === pos && p.st === 'ok'; })
            .sort(function (a, b) { return (a.slot === 'B' ? 0 : 1) - (b.slot === 'B' ? 0 : 1) || a.name.localeCompare(b.name); });
          if (give.length) spares[pos] = { sur: sur, give: give.slice(0, 3) };
        }
      });
      return { t: t, needs: needs, spares: spares };
    });
    function legs(a, b) {
      var out = [];
      Object.keys(a.needs).forEach(function (pos) {
        if (b.spares[pos]) out.push({ pos: pos, need: a.needs[pos], sp: b.spares[pos] });
      });
      return out;
    }
    var pairs = [];
    for (var i = 0; i < infos.length; i++) {
      for (var j = i + 1; j < infos.length; j++) {
        var A = infos[i], B = infos[j];
        var aGets = legs(A, B), bGets = legs(B, A);
        if (!aGets.length && !bGets.length) continue;
        var wt = 0;
        aGets.concat(bGets).forEach(function (l) { wt += l.need.kind === 'hole' ? 2 : 1; });
        pairs.push({ A: A, B: B, aGets: aGets, bGets: bGets, two: !!(aGets.length && bGets.length), wt: wt });
      }
    }
    pairs.sort(function (x, y) { return (y.two - x.two) || (y.wt - x.wt) || (x.A.t.rank + x.B.t.rank) - (y.A.t.rank + y.B.t.rank); });
    return { infos: infos, pairs: pairs };
  }
  function legHTML(giver, taker, list) {
    // list = what the taker gets from the giver
    if (!list.length) return '<div class="leg"><h4>' + esc(giver.t.team) + ' sends</h4><p class="none">Nothing the other side needs.</p></div>';
    return '<div class="leg"><h4>' + esc(giver.t.team) + ' sends</h4>' + list.map(function (l) {
      var names = l.sp.give.map(function (p) { return esc(p.name) + ' (' + esc(p.nfl) + (p.slot === 'B' ? '' : ', starter') + ')'; }).join(', ');
      return '<p><b>' + l.pos + '</b> · ' + esc(taker.t.team) + ' has ' + (l.need.kind === 'hole' ? 'a hole' : 'no spare') + ', ' + esc(giver.t.team) + ' has +' + l.sp.sur + '</p><p>' + names + '</p>';
    }).join('') + '</div>';
  }
  function tradesHTML() {
    var w = state.week, m = tradeModel(w);
    var holes = 0; m.infos.forEach(function (i) { holes += Object.keys(i.needs).filter(function (k) { return i.needs[k].kind === 'hole'; }).length; });
    var two = m.pairs.filter(function (p) { return p.two; }), one = m.pairs.filter(function (p) { return !p.two; });
    var shown = state.tmOne ? two.concat(one) : two;
    var cards = shown.map(function (p) {
      return '<article class="pair' + (p.two ? '' : ' one') + '"><h3>' + esc(p.A.t.team) + '<span>↔</span>' + esc(p.B.t.team) + '</h3>' +
        '<div class="read"><span class="chip ' + (p.two ? 'stack' : 'warn') + '">' + (p.two ? 'Both sides fill a need' : 'One-way only') + '</span></div>' +
        legHTML(p.B, p.A, p.aGets) + legHTML(p.A, p.B, p.bGets) + '</article>';
    }).join('');
    return '' +
      '<div class="controls"><div class="weeks" role="group" aria-label="Week"><span class="ctl-label">Byes for</span>' + weekChipsHTML(w) + '</div></div>' +
      '<div class="controls"><div class="weeks" role="group" aria-label="Options"><span class="ctl-label">Needs</span>' +
        fchips([['on', 'Holes + no spare'], ['off', 'Holes only']], state.tmThin ? 'on' : 'off', 'tmthin') +
        '<span class="ctl-label" style="margin-left:14px">Show</span>' +
        fchips([['off', 'Both-way only'], ['on', 'Include one-way']], state.tmOne ? 'on' : 'off', 'tmone') + '</div></div>' +
      '<p class="take">Real holes league-wide: <b>' + holes + '</b>. Both-way matches: <b>' + two.length + '</b>. One-way matches: <b>' + one.length + '</b>.</p>' +
      (shown.length ? '<div class="pairs">' + cards + '</div>' : '<p class="take">No matches with these settings. Try including no-spare positions, a later bye week, or one-way matches.</p>') +
      '<div class="notes"><p><b>Need</b> means fewer usable players than the lineup requires. <b>No spare</b> means exactly the requirement, so one injury creates a hole. <b>Spare</b> means 2 or more beyond the requirement, and only healthy players are offered, bench first.</p>' +
      '<p>FLEX is not matched on its own because any spare RB, WR or TE fills it. These are conversation starters based on depth only, not value. Nothing here judges whether a trade is fair.</p></div>';
  }

  /* ---------- Placeholder tabs ---------- */
  function stubHTML(kind) {
    return '<section class="stub"><h2>Coming soon</h2></section>';
  }

  /* ---------- Render ---------- */
  function render() {
    var d = state.data;
    $('#eyebrow').textContent = 'Kinda Fam · 2026' + (state.baseWeek ? ' · Week ' + state.baseWeek : '');
    var src = $('#src');
    if (state.source === 'live') { src.className = 'src live'; src.textContent = 'Live from Sleeper · ' + fmtDate(state.liveAt); }
    else { src.className = 'src'; src.textContent = 'Snapshot · ' + fmtDate(d.asOf); }
    ['depth', 'injuries', 'trades'].forEach(function (id) {
      $('#tab-' + id).setAttribute('aria-selected', String(state.tab === id));
    });
    $('#panel').setAttribute('aria-labelledby', 'tab-' + state.tab);
    $('#panel').innerHTML = state.tab === 'depth' ? depthHTML() : (state.tab === 'injuries' ? injuriesHTML() : tradesHTML());
    $('#foot').textContent = 'Rosters and injury statuses come from Sleeper. Bye weeks come from the 2026 NFL schedule. Rosters pull fresh every time the page loads. Injury tags are saved for up to 6 hours, or 30 minutes if you press Refresh.';
  }

  function setStatus(msg) { var el = $('#status'); if (el) el.textContent = msg; }

  /* ---------- Events ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'fpos' || act === 'fsev') {
      if (act === 'fpos') state.fPos = el.getAttribute('data-v'); else state.fSev = el.getAttribute('data-v');
      render();
      var fc = document.querySelector('.fchip[data-act="' + act + '"][aria-pressed="true"]'); if (fc) fc.focus();
      return;
    }
    if (act === 'tmthin' || act === 'tmone') {
      var on = el.getAttribute('data-v') === 'on';
      if (act === 'tmthin') state.tmThin = on; else state.tmOne = on;
      render();
      var tc = document.querySelector('.fchip[data-act="' + act + '"][aria-pressed="true"]'); if (tc) tc.focus();
      return;
    }
    if (act === 'tab') {
      state.tab = el.getAttribute('data-tab');
      try { history.replaceState(null, '', '#' + state.tab); } catch (err) {}
      render();
    } else if (act === 'week') {
      state.week = parseInt(el.getAttribute('data-week'), 10) || 0;
      state.weekTouched = true;
      render();
      var wk = document.querySelector('.wk[aria-pressed="true"]'); if (wk) wk.focus();
    } else if (act === 'team') {
      var id = parseInt(el.getAttribute('data-team'), 10);
      if (state.openTeam === id) { state.openTeam = null; state.openPos = null; } else { state.openTeam = id; state.openPos = null; }
      render();
      var tb = document.querySelector('.teambtn[data-team="' + id + '"]'); if (tb) tb.focus();
    } else if (act === 'cell') {
      var tid = parseInt(el.getAttribute('data-team'), 10), pos = el.getAttribute('data-pos');
      if (state.openTeam === tid && state.openPos === pos) { state.openTeam = null; state.openPos = null; } else { state.openTeam = tid; state.openPos = pos; }
      render();
      var cb = document.querySelector('.cell[data-team="' + tid + '"][data-pos="' + pos + '"]'); if (cb) cb.focus();
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'countQ') { state.countQ = e.target.checked; render(); var c = $('#countQ'); if (c) c.focus(); }
    if (e.target.id === 'sort') { state.sort = e.target.value; render(); var s = $('#sort'); if (s) s.focus(); }
  });
  $('#refresh').addEventListener('click', function () { goLive(true); });

  /* ---------- Live Sleeper pull ---------- */
  function getJSON(url, ms) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, ms || 8000);
    return fetch(url, { signal: ctl.signal }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) { clearTimeout(timer); return j; }, function (err) { clearTimeout(timer); throw err; });
  }

  // The full player list is several MB and Sleeper asks apps to fetch it about once a day,
  // so keep only the players on league rosters and cache them in the browser.
  function getPlayers(ids, manual) {
    var KEY = 'kf-players-v1', cache = null;
    try { cache = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { cache = null; }
    if (cache && cache.map) {
      var age = Date.now() - cache.ts;
      var missing = ids.filter(function (id) { return !cache.map[id]; }).length;
      // Injury tags live in this list, so keep it fresh: 6 hours on load, 30 minutes when you press Refresh.
      var maxAge = manual ? 30 * 60e3 : 6 * 3600e3;
      if (age < maxAge && (missing === 0 || age < 3600e3)) return Promise.resolve(cache.map);
    }
    return getJSON(BASE + '/players/nfl', 90000).then(function (all) {
      var map = {};
      ids.forEach(function (id) {
        var p = all[id];
        if (p) map[id] = { n: p.full_name || ((p.first_name || '') + ' ' + (p.last_name || '')).trim(), p: p.position, t: p.team || 'FA', i: p.injury_status || '' };
      });
      try { localStorage.setItem(KEY, JSON.stringify({ ts: Date.now(), map: map })); } catch (e) {}
      return map;
    });
  }

  function goLive(manual) {
    if (manual) setStatus('Pulling from Sleeper...');
    var L = BASE + '/league/' + KF.LEAGUE_ID;
    return Promise.resolve().then(function () {
      return Promise.all([getJSON(BASE + '/state/nfl'), getJSON(L + '/users'), getJSON(L + '/rosters')]);
    }).then(function (r) {
      var ids = [];
      r[2].forEach(function (ro) { (ro.players || []).forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); }); });
      return getPlayers(ids, manual).then(function (pmap) { return KF.fromSleeper(r[1], r[2], pmap, r[0]); });
    }).then(function (data) {
      var ok = data.teams.length === 10 && data.teams.every(function (t) { return t.players.length >= 10; });
      if (!ok) throw new Error('Unexpected data');
      state.data = data; state.source = 'live'; state.liveAt = data.asOf;
      if (data.week) { state.baseWeek = data.week; if (!state.weekTouched) state.week = data.week; }
      render();
      if (manual) setStatus('Updated from Sleeper.');
    }).catch(function () {
      if (manual) setStatus('Could not reach Sleeper from this page, so the snapshot is still showing.');
    });
  }

  /* ---------- Boot ---------- */
  (function () {
    var h = (location.hash || '').replace('#', '');
    if (h === 'injuries' || h === 'trades' || h === 'depth') state.tab = h;
  })();
  render();
  goLive(false);
})();
</script>

</body>
</html>
